services:
  hoi4wise:
    image: ghcr.io/sjefkebakfiets/hoi4wise:${HOI4WISE_TAG:-latest}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - campaigns:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  campaigns:
