name: Docker image
on:
  push:
    branches: [main, master, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container smoke test and persistence
        shell: bash
        run: |
          docker build -t hoi4wise:smoke .
          docker volume create hoi4wise-smoke
          docker run -d --name hoi4wise-smoke -p 18373:3000 -v hoi4wise-smoke:/app/data hoi4wise:smoke
          trap 'docker rm -f hoi4wise-smoke; docker volume rm hoi4wise-smoke' EXIT
          for i in {1..30}; do curl -fsS http://localhost:18373/api/health && break || sleep 1; done
          curl -fsS -X PUT -H 'Content-Type: application/json' --data '{"profile":{"dlc":[],"version":"1.19.3"},"favorites":[],"campaigns":[{"id":"smoke","country":"GER","route":"ger-basis","date":"1936-01-01","done":[],"notes":"persist-marker"}]}' http://localhost:18373/api/state
          docker restart hoi4wise-smoke
          for i in {1..30}; do curl -fsS http://localhost:18373/api/health && break || sleep 1; done
          curl -fsS http://localhost:18373/api/state | grep 'persist-marker'
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sjefkebakfiets/hoi4wise
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
